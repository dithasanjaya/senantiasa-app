<link rel="icon" type="image/png" href="assets/img/logo.png?v=20260925d">
<link rel="apple-touch-icon" href="assets/img/logo.png?v=20260925d">
<!-- manifest.json + theme-color = syarat PWA supaya bisa "Instal Aplikasi" (lihat sw.js utk
     catatan lengkap -- hanya aktif kalau dibuka lewat http(s), bukan file:// langsung). -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#D47444">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<!-- SDK Firebase (assets/js/firebase-init.js) didownload dari CDN google -- di koneksi biasa itu
     makan waktu, dan SELAMA itu gerbang login (di bawah) menunggu tahu status login sblm nentuin
     tampilan apa yg muncul. "modulepreload" di sini mulai download-nya SEDINI mungkin (bareng
     CSS/font, jauh sblm <script type="module"> di body ketemu), supaya jeda itu sesingkat2nya. -->
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js">
<!-- "?v=" di tiap file CSS/JS/gambar di bawah ini SENGAJA ada -- ini "cache-busting": browser
     menganggap URL dgn query string berbeda sbg file yg berbeda sama sekali, jadi tidak akan
     memakai salinan lama yg ke-cache dari kunjungan sebelumnya ke folder yg sama. Kalau ke depan
     ada pembaruan file index.html/assets, GANTI NILAI "v=20260925d" di semua tag ini (cukup
     cari-ganti satu nilai yg sama) supaya versi terbaru pasti termuat, bukan versi lama dari cache
     browser. -->
<link rel="stylesheet" href="assets/css/style.css?v=20260925d">
</head>
<body>

<!-- Gerbang login (lihat assets/js/auth.js & assets/js/firebase-init.js -- pakai Firebase
     Authentication sungguhan, bukan cuma dicek di browser). Sengaja TIDAK dikasih atribut
     "hidden" di sini (tampil dulu by default) supaya kalau JS gagal dimuat, app tetap tidak
     kebuka (gagal-tertutup, bukan gagal-terbuka).
     Firebase butuh waktu (download SDK + cek sesi lama) sblm tahu user ini sudah login atau
     belum -- SELAMA itu yg tampil cuma spinner polos (bukan kotak putih mirip form login),
     supaya kalau pun keliatan sekejap, tidak seperti "halaman login" numpang lewat. Kotak
     login (logo+form) BARU disisipkan ke DOM lewat JS begitu dipastikan BENAR belum login --
     bukan cuma disembunyikan pakai `hidden`, supaya user login yg sesinya valid TIDAK PERNAH
     ikut menerima/merender markup form itu sama sekali. -->
<div id="gerbangKunci" class="gerbang-kunci">
  <div class="gerbang-kunci__spinner" aria-label="Memuat"></div>
</div>
<script type="module" src="assets/js/firebase-init.js?v=20260925d"></script>
<script src="assets/js/auth.js?v=20260925d"></script>

<!-- Bar atas & backdrop cuma tampil di layar sempit (lihat @media di style.css) -- sidebar
     (menu + filter kontekstual) jadi panel geser (drawer) yg ditoggle lewat class "menu-terbuka"
     di <body>. Bar ini SENGAJA selebar layar & latarnya solid/tidak transparan (bukan cuma
     tombol bulat "mengambang" spt percobaan pertama) -- supaya begitu halaman di-scroll, konten
     di baliknya benar2 ketutup rapi, tidak nongol di sekeliling tombol. -->

  </button>
  <img src="assets/img/logo.png?v=20260925d" alt="" class="mobile-topbar__logo">
</div>
